<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2e2a"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <!-- Rounded dark background with subtle Nuxt-green tint -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Subtle dashed time axis (top) -->
  <line x1="16" y1="22" x2="100" y2="22" stroke="#1f3a36" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Nuxt-style triangle (top-right) -->
  <path d="M104 30 L116 30 L110 20 Z" fill="#00DC82"/>
  <!-- Network waterfall: three fetch bars at different start offsets and durations -->
  <rect x="16" y="40" width="62" height="14" rx="3" fill="#00DC82"/>
  <rect x="34" y="62" width="78" height="14" rx="3" fill="#00B975"/>
  <rect x="52" y="84" width="34" height="14" rx="3" fill="#7AE6B8"/>
  <!-- Forward arrow at the bottom (data flowing) -->
  <path d="M86 106 L102 112 L86 118 Z" fill="#e6edf3"/>
</svg>
